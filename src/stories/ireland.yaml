# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/scrollytelling.schema.json
#
# The story on src/pages/scrollytelling.mdx. The map stays on screen while the
# chapters scroll over it; each chapter moves the camera and can show or hide
# layers. Chapter text (`description`) is HTML, not Markdown.
type: scrollytelling
id: ireland-story
theme: light           # chapter cards: light or dark
showMarkers: true      # a dot per chapter at the right edge; click one to jump
markerColor: "#CF729B"

# The map when the page opens.
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-7.6, 53.6]
  zoom: 6
  interactive: false   # scrolling moves the story, not the map

# Every layer the story uses. A layer that a chapter reveals later starts
# hidden with `layout: { visibility: none }`.
layers: 

  - id: ghg-permits
    type: circle
    source:
      type: geojson
      url: "/data/ghg-permits.geojson"
    layout:
      visibility: none
    paint:
      circle-radius: 7
      circle-color: "#CF729B"
      circle-stroke-color: "#221E1C"
      circle-stroke-width: 2

  - id: grid-lines
    type: line
    source:
      type: geojson
      url: "/data/grid-lines.geojson"
    layout:
      visibility: none
    paint:
      line-color: "#3B5F88"
      line-width: 0.75
      line-opacity: 0.7

  - id: substations
    type: circle
    source:
      type: geojson
      url: "/data/substations.geojson"
    layout:
      visibility: none
    paint:
      circle-radius: 2.5
      circle-color: "#3B5F88"

  - id: data-centres
    type: circle
    source:
      type: geojson
      url: "/data/sites.geojson"
    filter: ["!=", ["get", "precision"], "county only"]
    layout:
      visibility: none
    paint:
      circle-radius: 5
      circle-color: "#CF729B"
      circle-stroke-color: "#FCFBFA"
      circle-stroke-width: 1


chapters:
  - id: intro
    title: "Earth, Wind, Water - Wire"
    description: >-
      <p>Data centres on the island of Ireland extract from its land; through siting, water usage and
      power through the electricity grid. This story maps where they
      are, how they connect to the grid, what resources they use, and where
      they could be built and powered differently.</p>
    center: [-6.33, 53.35]
    zoom: 9.5
    alignment: left
    layers:
      show: [data-centres]

  - id: wired
    title: "2. Wired IN"
    description: >-
      <p>Each site needs a high-voltage connection. Substations, where
      electricity is stepped down for local use, cluster where the data
      centres are.</p>
    center: [-6.6, 53.45]
    zoom: 8
    alignment: left
    layers:
      show: [grid-lines, substations, data-centres]

  - id: extraction
    title: "3. Extraction"
    description: >-
      <p>In 2025, 47% of Ireland's electricity came from gas and 40% from
      wind (Central Statistics Office). Where the Dublin grid can't supply
      more, data centres install their own generators.</p>
      <p>Each pink dot is a data centre installation holding an EPA permit
      to burn fuel on-site, mostly backup diesel and gas. A permit shows the
      capacity to burn fuel but not how often it is used.</p>
    center: [-6.38, 53.35]
    zoom: 10
    alignment: right
    layers:
      show: [ghg-permits]
      hide: [grid-lines, substations, data-centres]

  - id: outro
    title: Back to New York
    description: >-
      <p><code>rotateAnimation: true</code> turns the camera slowly while this
      chapter is on screen. Edit <code>src/stories/nyc.yaml</code> to write
      your own story.</p>
    center: [-73.99, 40.73]
    zoom: 11
    pitch: 50
    rotateAnimation: true
    alignment: full

footer: >-
  <p>Data: Sources to Add</p>
